<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

video{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  object-fit:cover !important;
  z-index:0 !important;
}

a-scene{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  z-index:1;
}

a-scene canvas{
  background:transparent !important;
}

/* =========================
   LOG
========================= */
#log{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  max-height:35vh;
  overflow-y:auto;
  background:rgba(0,0,0,0.7);
  color:#00ff88;
  font-family:monospace;
  font-size:12px;
  padding:8px 10px;
  z-index:9999;
  pointer-events:none;
}

/* =========================
   BUTTON
========================= */
.ctrl-btn{
  position:fixed;
  z-index:10000;

  background:rgba(0,0,0,0.65);
  color:#fff;

  border:1px solid rgba(255,255,255,0.35);
  border-radius:8px;

  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  font-family:monospace;

  cursor:pointer;
  user-select:none;

  transition:background 0.15s;
}

.ctrl-btn:active{
  background:rgba(255,255,255,0.15);
}

.ctrl-btn:disabled{
  opacity:0.5;
  cursor:default;
}

#ss-btn{
  left:10px;
  bottom:10px;
}

#rec-btn{
  left:70px;
  bottom:10px;
  gap:2px;
}

#full-btn{
  right:10px;
  top:10px;
}

#log-clear{
  right:10px;
  top:70px;

  width:auto;
  height:auto;

  padding:6px 10px;
  font-size:12px;
}

/* =========================
   REC
========================= */
#rec-btn.recording{
  background:rgba(180,0,0,0.75);
  border-color:#ff4444;
  animation:rec-pulse 1.2s ease-in-out infinite;
}

@keyframes rec-pulse{
  0%,100%{opacity:1;}
  50%{opacity:0.7;}
}

#mic-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:16px;
  height:16px;

  font-size:10px;
  border-radius:50%;
}

#mic-badge.on{
  background:rgba(0,200,100,0.35);
  color:#afffcc;
}

#mic-badge.off{
  background:rgba(255,80,80,0.3);
  color:#ffaaaa;
}

/* =========================
   COUNTDOWN
========================= */
#countdown-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:20000;
  align-items:center;
  justify-content:center;
  background:transparent;
  pointer-events:none;
}

#countdown-overlay.active{
  display:flex;
}

#countdown-num{
  font-size:clamp(80px,25vw,160px);
  font-family:monospace;
  font-weight:900;
  color:#fff;

  text-shadow:
    0 0 20px rgba(0,0,0,0.8),
    0 2px 6px rgba(0,0,0,0.9);

  line-height:1;

  animation:pop 0.4s ease-out;
}

@keyframes pop{
  0%{
    transform:scale(1.6);
    opacity:0;
  }
  60%{
    transform:scale(0.95);
    opacity:1;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   FLASH
========================= */
#ss-flash{
  display:none;
  position:fixed;
  inset:0;
  z-index:30000;
  background:#fff;
  pointer-events:none;
}

#ss-flash.active{
  display:block;
  animation:flash-anim 0.35s ease-out forwards;
}

@keyframes flash-anim{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* =========================
   REC HINT
========================= */
#rec-hint{
  display:none;

  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);

  z-index:10000;

  background:rgba(180,0,0,0.72);
  color:#fff;

  font-family:monospace;
  font-size:14px;

  padding:8px 18px;

  border-radius:20px;
  border:1px solid rgba(255,100,100,0.5);

  pointer-events:none;
  white-space:nowrap;
}

#rec-hint.active{
  display:block;
}

<script>

/* =========================================================
   smooth-transform
========================================================= */
AFRAME.registerComponent("smooth-transform", {
  schema:{
    alpha:{ type:"number", default:0.4 }
  },

  init:function(){

    this.smoothPos   = new THREE.Vector3();
    this.smoothQuat  = new THREE.Quaternion();
    this.smoothScale = new THREE.Vector3(1,1,1);

    this.targetPos   = new THREE.Vector3();
    this.targetQuat  = new THREE.Quaternion();
    this.targetScale = new THREE.Vector3(1,1,1);

    this.isVisible = false;

    const el = this.el;

    el.addEventListener("targetFound", () => {
      this.isVisible = true;
      this.firstFrame = true;
    });

    el.addEventListener("targetLost", () => {
      this.isVisible = false;
    });
  },

  tick:function(){

    if(!this.isVisible) return;

    const obj = this.el.object3D;

    this.targetPos.copy(obj.position);
    this.targetQuat.copy(obj.quaternion);
    this.targetScale.copy(obj.scale);

    if(this.firstFrame){

      this.smoothPos.copy(this.targetPos);
      this.smoothQuat.copy(this.targetQuat);
      this.smoothScale.copy(this.targetScale);

      this.firstFrame = false;
      return;
    }

    const a = this.data.alpha;

    this.smoothPos.lerp(this.targetPos, a);
    this.smoothQuat.slerp(this.targetQuat, a);
    this.smoothScale.lerp(this.targetScale, a);

    obj.position.copy(this.smoothPos);
    obj.quaternion.copy(this.smoothQuat);
    obj.scale.copy(this.smoothScale);
  }
});

const logEl = document.getElementById("log");

function log(msg, color){

  const time = new Date().toTimeString().slice(0,8);

  const line = document.createElement("div");

  line.style.color = color || "#00ff88";

  line.textContent = "[" + time + "] " + msg;

  logEl.appendChild(line);

  logEl.scrollTop = logEl.scrollHeight;

  console.log(msg);
}

window.onerror = function(msg,url,line){

};

/* =========================================================
   SCREENSHOT / RECORD / FULLSCREEN
========================================================= */

const countdownOverlay = document.getElementById("countdown-overlay");
const countdownNum     = document.getElementById("countdown-num");
const ssFlash          = document.getElementById("ss-flash");
const recHint          = document.getElementById("rec-hint");

const UI_SELECTORS = [
  "#log",
  "#log-clear",
  "#ss-btn",
  "#rec-btn",
  "#full-btn"
];

function setUIVisible(visible){

  UI_SELECTORS.forEach(sel => {

    const el = document.querySelector(sel);

    if(el){
      el.style.visibility = visible ? "visible" : "hidden";
    }

  });
}

function countdown(seconds){

  return new Promise(resolve => {

    countdownNum.textContent = seconds;

    countdownOverlay.classList.add("active");

    let remaining = seconds;

    const tick = () => {

      remaining--;

      if(remaining <= 0){

        countdownOverlay.classList.remove("active");

        resolve();

        return;
      }

      countdownNum.textContent = remaining;

      countdownNum.style.animation = "none";

      void countdownNum.offsetWidth;

      countdownNum.style.animation = "";

      setTimeout(tick, 1000);
    };

    setTimeout(tick, 1000);
  });
}

function doFlash(){

  return new Promise(resolve => {

    ssFlash.classList.remove("active");

    void ssFlash.offsetWidth;

    ssFlash.classList.add("active");

    ssFlash.addEventListener("animationend", () => {

      ssFlash.classList.remove("active");

      resolve();

    }, { once:true });

  });
}

function downloadBlob(blob, filename){

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = filename;

  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 3000);
}

function nowString(){

  const now = new Date();

  const pad = n => String(n).padStart(2, "0");

  return now.getFullYear()
    + pad(now.getMonth() + 1)
    + pad(now.getDate())
    + "_"
    + pad(now.getHours())
    + pad(now.getMinutes())
    + pad(now.getSeconds());
}

/* =========================================================
   SCREENSHOT
   preserveDrawingBuffer:false のため撮影直前だけ true に切替
========================================================= */
function captureOnNextRender(){

  return new Promise((resolve, reject) => {

    const sceneEl = document.querySelector("a-scene");

    const renderer = sceneEl && sceneEl.renderer;

    if(!renderer){
      reject(new Error("renderer not ready"));
      return;
    }

    /* --- preserveDrawingBuffer を一時的に true へ --- */
    const gl = renderer.getContext();
    const ext = gl.getExtension("WEBGL_lose_context");

    renderer.preserveDrawingBuffer = true;

    const originalRender = renderer.render.bind(renderer);

    renderer.render = function(scene3, camera){

      originalRender(scene3, camera);

      renderer.render = originalRender;

      try{

        const W = window.innerWidth;
        const H = window.innerHeight;

        const composite = document.createElement("canvas");

        composite.width  = W;
        composite.height = H;

        const ctx = composite.getContext("2d");

        const video = document.querySelector("video");

        if(video && video.readyState >= 2){

          const vW = video.videoWidth;
          const vH = video.videoHeight;

          const scale = Math.max(W / vW, H / vH);

          const dw = vW * scale;
          const dh = vH * scale;

          ctx.drawImage(
            video,
            (W - dw) / 2,
            (H - dh) / 2,
            dw,
            dh
          );
        }

        ctx.drawImage(renderer.domElement, 0, 0, W, H);

        composite.toBlob(blob => {

          /* 撮影完了後に false へ戻す */
          renderer.preserveDrawingBuffer = false;

          if(blob){
            resolve(blob);
          }else{
            reject(new Error("toBlob null"));
          }

        }, "image/png");

      }catch(err){

        renderer.preserveDrawingBuffer = false;

        reject(err);
      }
    };
  });
}

const ssBtn = document.getElementById("ss-btn");

async function takeScreenshot(){

  ssBtn.disabled = true;

  setUIVisible(false);

  await countdown(3);

  try{

    const [blob] = await Promise.all([
      captureOnNextRender(),
      doFlash()
    ]);

    downloadBlob(
      blob,
      "screenshot_" + nowString() + ".png"
    );

  }catch(err){

    log("SS ERROR: " + err.message, "#ff5555");

  }

  setUIVisible(true);

  ssBtn.disabled = false;
}

ssBtn.addEventListener("click", takeScreenshot);

/* =========================================================
   RECORD
========================================================= */
const recBtn   = document.getElementById("rec-btn");
const micBadge = document.getElementById("mic-badge");

let isRecording   = false;
let mediaRecorder = null;
let recordedChunks = [];

let compositeCanvas = null;
let compositeCtx    = null;

let rafId     = null;
let micStream = null;

function drawCompositeFrame(){

  if(!isRecording) return;

  const W = compositeCanvas.width;
  const H = compositeCanvas.height;

  const sceneEl  = document.querySelector("a-scene");
  const renderer = sceneEl && sceneEl.renderer;

  compositeCtx.clearRect(0,0,W,H);

  const video = document.querySelector("video");

  if(video && video.readyState >= 2){

    const vW = video.videoWidth;
    const vH = video.videoHeight;

    const scale = Math.max(W / vW, H / vH);

    const dw = vW * scale;
    const dh = vH * scale;

    compositeCtx.drawImage(
      video,
      (W - dw) / 2,
      (H - dh) / 2,
      dw,
      dh
    );
  }

  if(renderer && renderer.domElement){
    compositeCtx.drawImage(renderer.domElement,0,0,W,H);
  }

  rafId = requestAnimationFrame(drawCompositeFrame);
}

function stopRecording(){

  if(!isRecording) return;

  isRecording = false;

  document.removeEventListener(
    "touchstart",
    stopOnTap,
    { capture:true }
  );

  document.removeEventListener(
    "mousedown",
    stopOnTap,
    { capture:true }
  );

  if(rafId !== null){

    cancelAnimationFrame(rafId);

    rafId = null;
  }

  if(mediaRecorder && mediaRecorder.state !== "inactive"){
    mediaRecorder.stop();
  }

  if(micStream){

    micStream.getTracks().forEach(t => t.stop());

    micStream = null;
  }

  recHint.classList.remove("active");

  recBtn.classList.remove("recording");

  recBtn.disabled = false;

  setUIVisible(true);
}

function stopOnTap(){
  stopRecording();
}

async function startRecording(){

  if(isRecording) return;

  recBtn.disabled = true;

  setUIVisible(false);

  await countdown(3);

  let audioTracks = [];

  try{

    micStream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:false
    });

    audioTracks = micStream.getAudioTracks();

  }catch(err){

    micStream = null;
  }

  const W = window.innerWidth;
  const H = window.innerHeight;

  compositeCanvas = document.createElement("canvas");

  compositeCanvas.width  = W;
  compositeCanvas.height = H;

  compositeCtx = compositeCanvas.getContext("2d");

  const fps = 30;

  const videoStream = compositeCanvas.captureStream(fps);

  audioTracks.forEach(t => {
    videoStream.addTrack(t);
  });

  micBadge.textContent =
    audioTracks.length ? "🎙 ON" : "🎙 OFF";

  micBadge.className =
    audioTracks.length ? "on" : "off";

  let mimeType = "";

  const mimeTypes = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  for(const mt of mimeTypes){

    if(MediaRecorder.isTypeSupported(mt)){
      mimeType = mt;
      break;
    }
  }

  mediaRecorder = new MediaRecorder(
    videoStream,
    mimeType ? { mimeType } : {}
  );

  recordedChunks = [];

  mediaRecorder.ondataavailable = e => {

    if(e.data && e.data.size > 0){
      recordedChunks.push(e.data);
    }
  };

  mediaRecorder.onstop = () => {

    const blob = new Blob(
      recordedChunks,
      { type:mimeType || "video/webm" }
    );

    downloadBlob(
      blob,
      "video_" + nowString() + ".webm"
    );

    recordedChunks = [];
  };

  isRecording = true;

  mediaRecorder.start(200);

  drawCompositeFrame();

  recBtn.classList.add("recording");

  recBtn.disabled = false;

  recHint.classList.add("active");

  setTimeout(() => {

    document.addEventListener(
      "touchstart",
      stopOnTap,
      { capture:true }
    );

    document.addEventListener(
      "mousedown",
      stopOnTap,
      { capture:true }
    );

  }, 300);
}

recBtn.addEventListener("click", () => {

  if(isRecording){
    stopRecording();
  }else{
    startRecording();
  }

});

/* =========================================================
   FULLSCREEN
========================================================= */
const fullBtn = document.getElementById("full-btn");

function isFullscreen(){

  return !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement
  );
}

function requestFullscreen(el){

  if(el.requestFullscreen){
    return el.requestFullscreen();
  }
  else if(el.webkitRequestFullscreen){
    return el.webkitRequestFullscreen();
  }
  else if(el.mozRequestFullScreen){
    return el.mozRequestFullScreen();
  }
  else if(el.msRequestFullscreen){
    return el.msRequestFullscreen();
  }
}

function exitFullscreen(){

  if(document.exitFullscreen){
    return document.exitFullscreen();
  }
  else if(document.webkitExitFullscreen){
    return document.webkitExitFullscreen();
  }
  else if(document.mozCancelFullScreen){
    return document.mozCancelFullScreen();
  }
  else if(document.msExitFullscreen){
    return document.msExitFullscreen();
  }
}

fullBtn.addEventListener("click", () => {

  if(isFullscreen()){

    exitFullscreen();

  }else{

    requestFullscreen(document.documentElement);

  }
});
